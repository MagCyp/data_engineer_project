[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-mobility-data-platform"
version = "0.1.0"
description = "NYC mobility and weather data platform pet project"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "dbt-core==1.12.5",
    "dbt-postgres==1.11.0",
    "httpx==0.28.1",
    "pandera==0.33.1",
    "polars==1.44.2",
    "psycopg[binary]==3.3.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
active-mobility-pipeline = "active_mobility_pipeline.cli:main"
mta-subway-pipeline = "mta_subway_pipeline.cli:main"
weather-pipeline = "weather_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
