[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-data-platform"
version = "0.1.0"
description = "Data engineering pet project for weather data"
requires-python = ">=3.14"

[project.scripts]
active-mobility-pipeline = "active_mobility_pipeline.cli:main"
mta-subway-pipeline = "mta_subway_pipeline.cli:main"
weather-pipeline = "weather_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
