apis:
  open_meteo_archive:
    base_url: https://archive-api.open-meteo.com/v1/archive
    timeout_seconds: 30

  ny_open_data:
    base_url: https://data.ny.gov/resource
    response_format: json
    timeout_seconds: 60
    max_retries: 3
    retry_base_delay_seconds: 1
    retry_max_delay_seconds: 60

  nyc_open_data:
    base_url: https://data.cityofnewyork.us/resource
    response_format: json
    timeout_seconds: 60
    max_retries: 3
    retry_base_delay_seconds: 1
    retry_max_delay_seconds: 60

pipelines:
  weather:
    api: open_meteo_archive
    available_from: "1940-01-01"
    default_city: New York
    locations:
      - name: New York
        latitude: 40.7128
        longitude: -74.0060

      - name: Rome
        latitude: 41.9028
        longitude: 12.4964

      - name: Milan
        latitude: 45.4642
        longitude: 9.1900

      - name: Berlin
        latitude: 52.5200
        longitude: 13.4050

  active_mobility:
    api: nyc_open_data
    available_from: "2012-08-31"
    counts_resource_id: ct66-47at
    sensors_resource_id: 6up2-gnw8

  mta_subway:
    api: ny_open_data
    available_from: "2017-01-13"
    datasets:
      hourly_ridership_2017_2019:
        resource_id: t69i-h2me
        start_year: 2017
        end_year: 2019
        about_url: https://data.ny.gov/Transportation/MTA-Subway-Hourly-Ridership-2017-2019/t69i-h2me/about_data

      hourly_ridership_2020_2024:
        resource_id: wujg-7c2s
        start_year: 2020
        end_year: 2024
        about_url: https://data.ny.gov/Transportation/MTA-Subway-Hourly-Ridership-2020-2024/wujg-7c2s/about_data

      hourly_ridership_2025_present:
        resource_id: 5wq4-mkjj
        start_year: 2025
        end_year: null
        about_url: https://data.ny.gov/Transportation/MTA-Subway-Hourly-Ridership-Beginning-2025/5wq4-mkjj/about_data

storage:
  raw_path: data/raw/{pipeline_name}
  bronze_path: data/bronze/{pipeline_name}/year={year}/month={month}
  silver_path: data/silver/{pipeline_name}/year={year}/month={month}
  bronze_reference_path: data/bronze/{pipeline_name}/reference
  silver_reference_path: data/silver/{pipeline_name}/reference
