version: 2

models:
  - name: fct_weather_hourly
    description: One weather observation per location and UTC hour.
    columns:
      - name: location
        description: Weather observation location.
        data_tests:
          - not_null

      - name: observed_at_utc
        description: UTC observation hour.
        data_tests:
          - not_null

      - name: date_day
        description: New York local date containing the UTC hour.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_active_mobility_counts_hourly
    description: >-
      One directional bike, pedestrian, or scooter flow per UTC hour, with
      explicit source-coverage indicators.
    columns:
      - name: sensor_id
        description: Active-mobility sensor identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_active_mobility_sensor')
                field: sensor_id

      - name: flow_id
        description: Directional travel-mode flow identifier.
        data_tests:
          - not_null

      - name: travel_mode
        description: Bike, pedestrian, or scooter.
        data_tests:
          - not_null

      - name: observed_at_utc
        description: UTC observation hour.
        data_tests:
          - not_null

      - name: date_day
        description: New York local date containing the UTC hour.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: mobility_count
        description: Sum of raw or modified non-null counts.
        data_tests:
          - not_null

      - name: source_record_count
        description: Number of all source intervals received for the hour.

      - name: valid_source_record_count
        description: Number of intervals included in mobility_count.

      - name: problem_source_record_count
        description: Number of excluded or deleted source intervals.

      - name: expected_record_count
        description: Expected source intervals for this flow and UTC hour.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 4]
                quote: false

      - name: is_complete_hour
        description: >-
          True when received, valid, and expected interval counts agree and
          no source row is deleted or missing a value.
        data_tests:
          - not_null

      - name: latest_ingested_at
        description: Latest source ingestion timestamp within the hour.

  - name: fct_subway_ridership_hourly
    description: One station complex, transit mode, and UTC hour.
    columns:
      - name: station_complex_id
        description: MTA station-complex identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subway_station')
                field: station_complex_id

      - name: transit_mode
        description: Transit mode reported by the source.
        data_tests:
          - not_null

      - name: observed_at_utc
        description: UTC observation hour.
        data_tests:
          - not_null

      - name: date_day
        description: New York local date containing the UTC hour.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: ridership
        description: Total ridership across payment and fare categories.
        data_tests:
          - not_null

      - name: transfers
        description: Transfers already included within ridership.
        data_tests:
          - not_null

      - name: payment_method_count
        description: Number of represented payment methods.

      - name: fare_class_category_count
        description: Number of represented fare categories.

      - name: source_record_count
        description: Number of source rows aggregated into the fact row.
