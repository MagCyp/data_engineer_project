version: 2

unit_tests:
  - name: active_mobility_complete_hour_requires_exact_coverage
    description: >-
      A complete hour has exactly the expected number of valid intervals and
      no missing, extra, null, or deleted source record.
    model: fct_active_mobility_counts_hourly
    given:
      - input: ref('int_active_mobility_counts_hourly')
        rows:
          - {sensor_id: sensor-a, flow_id: complete-flow, travel_mode: bike, direction: in, observed_at_utc: '2025-01-01 05:00:00+00', interval_minutes: 15, mobility_count: 40, source_record_count: 4, valid_source_record_count: 4, problem_source_record_count: 0, latest_ingested_at: '2025-01-02 00:00:00+00'}
          - {sensor_id: sensor-a, flow_id: missing-flow, travel_mode: bike, direction: in, observed_at_utc: '2025-01-01 06:00:00+00', interval_minutes: 15, mobility_count: 30, source_record_count: 3, valid_source_record_count: 3, problem_source_record_count: 0, latest_ingested_at: '2025-01-02 00:00:00+00'}
          - {sensor_id: sensor-a, flow_id: extra-flow, travel_mode: bike, direction: in, observed_at_utc: '2025-01-01 07:00:00+00', interval_minutes: 15, mobility_count: 50, source_record_count: 5, valid_source_record_count: 5, problem_source_record_count: 0, latest_ingested_at: '2025-01-02 00:00:00+00'}
          - {sensor_id: sensor-a, flow_id: problem-flow, travel_mode: bike, direction: in, observed_at_utc: '2025-01-01 08:00:00+00', interval_minutes: 15, mobility_count: 30, source_record_count: 4, valid_source_record_count: 3, problem_source_record_count: 1, latest_ingested_at: '2025-01-02 00:00:00+00'}
          - {sensor_id: sensor-a, flow_id: hourly-flow, travel_mode: pedestrian, direction: out, observed_at_utc: '2025-01-01 09:00:00+00', interval_minutes: 60, mobility_count: 12, source_record_count: 1, valid_source_record_count: 1, problem_source_record_count: 0, latest_ingested_at: '2025-01-02 00:00:00+00'}
    expect:
      rows:
        - {flow_id: complete-flow, expected_record_count: 4, is_complete_hour: true}
        - {flow_id: missing-flow, expected_record_count: 4, is_complete_hour: false}
        - {flow_id: extra-flow, expected_record_count: 4, is_complete_hour: false}
        - {flow_id: problem-flow, expected_record_count: 4, is_complete_hour: false}
        - {flow_id: hourly-flow, expected_record_count: 1, is_complete_hour: true}
