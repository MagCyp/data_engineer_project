version: 2

models:
  - name: dim_date
    description: One row per New York local calendar date covered by the data.
    columns:
      - name: date_day
        description: New York local calendar date and dimension grain.
        data_tests:
          - not_null
          - unique

      - name: year
        description: Calendar year.

      - name: quarter
        description: Calendar quarter from 1 to 4.

      - name: month
        description: Calendar month from 1 to 12.

      - name: month_name
        description: English calendar month name.

      - name: day_of_month
        description: Day number within the month.

      - name: day_of_week
        description: ISO weekday number where Monday is 1 and Sunday is 7.

      - name: is_weekend
        description: True for Saturday and Sunday.

      - name: season
        description: Meteorological season in the Northern Hemisphere.

      - name: expected_hour_count
        description: Number of UTC hours in the New York local day (23, 24, or 25).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [23, 24, 25]
                quote: false

  - name: dim_active_mobility_sensor
    description: One row per NYC active-mobility sensor from the API snapshot.
    columns:
      - name: sensor_id
        description: Sensor identifier and dimension grain.
        data_tests:
          - not_null
          - unique

      - name: sensor_name
        description: Human-readable sensor name.

      - name: operator_name
        description: Organization operating the sensor.

      - name: latitude
        description: Sensor latitude in decimal degrees.
        data_tests:
          - not_null

      - name: longitude
        description: Sensor longitude in decimal degrees.
        data_tests:
          - not_null

      - name: recording_interval_minutes
        description: Recording interval declared by sensor metadata.

      - name: timezone
        description: IANA timezone applied to floating source timestamps.

      - name: travel_modes
        description: Comma-separated modes supported by the sensor.

      - name: is_directional
        description: Whether the sensor reports separate directional flows.

  - name: dim_subway_station
    description: >-
      One row per subway station complex. Distinct attributes are retained so
      the unique test fails instead of silently choosing conflicting values.
    columns:
      - name: station_complex_id
        description: MTA station-complex identifier and dimension grain.
        data_tests:
          - not_null
          - unique

      - name: station_complex_name
        description: Human-readable station-complex name.
        data_tests:
          - not_null

      - name: borough
        description: New York City borough containing the station complex.
        data_tests:
          - not_null

      - name: latitude
        description: Station latitude.
        data_tests:
          - not_null

      - name: longitude
        description: Station longitude.
        data_tests:
          - not_null
