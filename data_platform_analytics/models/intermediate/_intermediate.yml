version: 2

models:
  - name: int_active_mobility_counts_hourly
    description: >-
      Active-mobility counts aggregated to one row per directional flow and
      UTC hour without filtering incomplete hours.
    columns:
      - name: sensor_id
        description: Identifier of the counting location.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mobility__active_mobility_sensors')
                field: sensor_id

      - name: flow_id
        description: Directional travel-mode flow identifier.
        data_tests:
          - not_null

      - name: travel_mode
        description: Bike, pedestrian, or scooter.
        data_tests:
          - not_null

      - name: observed_at_local
        description: Beginning of the observation hour in local wall-clock time.
        data_tests:
          - not_null

      - name: observed_at_utc
        description: Beginning of the observation hour in UTC.
        data_tests:
          - not_null

      - name: timezone
        description: IANA timezone used for the local observation timestamp.
        data_tests:
          - not_null

      - name: interval_minutes
        description: Source interval used to calculate expected coverage.
        data_tests:
          - not_null

      - name: mobility_count
        description: Sum of valid source counts recorded during the hour.
        data_tests:
          - not_null

      - name: source_record_count
        description: Number of all source intervals received for the hour.
        data_tests:
          - not_null

      - name: valid_source_record_count
        description: >-
          Number of raw or modified source intervals with a non-null count.
        data_tests:
          - not_null

      - name: problem_source_record_count
        description: >-
          Number of deleted intervals or intervals with a null count.
        data_tests:
          - not_null

      - name: latest_ingested_at
        description: Latest ingestion timestamp among the source intervals.
        data_tests:
          - not_null

  - name: int_subway_ridership_hourly
    description: >-
      Subway ridership aggregated across fare and payment categories to one
      row per station complex, transit mode, and UTC hour. Descriptive station
      attributes are intentionally excluded from this fact-like model.
    columns:
      - name: station_complex_id
        description: MTA station-complex identifier.
        data_tests:
          - not_null

      - name: transit_mode
        description: Transit mode reported by the source.
        data_tests:
          - not_null

      - name: observed_at_utc
        description: Beginning of the observation hour in UTC.
        data_tests:
          - not_null

      - name: ridership
        description: Total ridership across fare and payment categories.
        data_tests:
          - not_null

      - name: transfers
        description: Total transfers across fare and payment categories.
        data_tests:
          - not_null

      - name: payment_method_count
        description: Number of distinct payment methods represented in the row.

      - name: fare_class_category_count
        description: Number of distinct fare categories represented in the row.

      - name: source_record_count
        description: Number of source fare-category rows included in the total.
        data_tests:
          - not_null

      - name: latest_ingested_at
        description: Latest ingestion timestamp among the source rows.
        data_tests:
          - not_null
