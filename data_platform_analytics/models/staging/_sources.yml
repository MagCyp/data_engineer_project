version: 2

sources:
  - name: mobility
    description: Data loaded into the landing schema by the Python ETL pipelines.
    schema: landing
    tables:
      - name: weather_observations
        description: Hourly weather observations by location.
        columns:
          - name: location
            description: Name of the observed location.
            data_tests:
              - not_null

          - name: timezone
            description: Timezone supplied by the weather source.
            data_tests:
              - not_null

          - name: observed_at_utc
            description: Observation timestamp normalized to UTC.
            data_tests:
              - not_null

          - name: temperature_c
            description: Air temperature in degrees Celsius.
            data_tests:
              - not_null

          - name: relative_humidity_pct
            description: Relative humidity percentage from 0 to 100.
            data_tests:
              - not_null

          - name: precipitation_mm
            description: Total precipitation in millimetres.
            data_tests:
              - not_null

          - name: rain_mm
            description: Rainfall in millimetres.
            data_tests:
              - not_null

          - name: wind_speed_kmh
            description: Wind speed in kilometres per hour.
            data_tests:
              - not_null

          - name: ingested_at
            description: UTC timestamp when the pipeline ingested the row.
            data_tests:
              - not_null

      - name: bike_counts
        description: Fifteen-minute bicycle counts from NYC counters.
        columns:
          - name: record_id
            description: Unique source record identifier.
            data_tests:
              - not_null
              - unique

          - name: counter_id
            description: Identifier of the bicycle counter.
            data_tests:
              - not_null

          - name: timezone
            description: IANA timezone used for the observation.
            data_tests:
              - not_null

          - name: observed_at_local
            description: Local observation timestamp without a timezone offset.
            data_tests:
              - not_null

          - name: observed_at_utc
            description: Observation timestamp normalized to UTC.
            data_tests:
              - not_null

          - name: bike_count
            description: Number of bicycles recorded during the interval.
            data_tests:
              - not_null

          - name: status
            description: Status code supplied by the counter source.
            data_tests:
              - not_null

          - name: ingested_at
            description: UTC timestamp when the pipeline ingested the row.
            data_tests:
              - not_null

      - name: subway_ridership
        description: Hourly subway ridership grouped by station and fare type.
        columns:
          - name: observed_at_local
            description: New York local observation timestamp.
            data_tests:
              - not_null

          - name: observed_at_utc
            description: Observation timestamp normalized to UTC.
            data_tests:
              - not_null

          - name: timezone
            description: IANA timezone used for the observation.
            data_tests:
              - not_null

          - name: transit_mode
            description: Transit mode reported by the source.
            data_tests:
              - not_null

          - name: station_complex_id
            description: MTA station-complex identifier.
            data_tests:
              - not_null

          - name: station_complex
            description: Human-readable station-complex name.
            data_tests:
              - not_null

          - name: borough
            description: New York City borough containing the station.
            data_tests:
              - not_null

          - name: payment_method
            description: Payment method used by riders.
            data_tests:
              - not_null

          - name: fare_class_category
            description: Fare category reported by the MTA source.
            data_tests:
              - not_null

          - name: ridership
            description: Estimated number of riders.
            data_tests:
              - not_null

          - name: transfers
            description: Estimated number of transfers included in ridership.
            data_tests:
              - not_null

          - name: latitude
            description: Station latitude.
            data_tests:
              - not_null

          - name: longitude
            description: Station longitude.
            data_tests:
              - not_null

          - name: ingested_at
            description: UTC timestamp when the pipeline ingested the row.
            data_tests:
              - not_null
