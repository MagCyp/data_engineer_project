version: 2

models:
  - name: stg_mobility__weather_observations
    description: >-
      Hourly weather observations exposed from the landing layer without
      changing their granularity.
    columns:
      - name: location
        description: Name of the observed location.
        data_tests:
          - not_null

      - name: timezone
        description: Timezone supplied by the weather source.

      - name: observed_at_utc
        description: Observation timestamp normalized to UTC.
        data_tests:
          - not_null

      - name: temperature_c
        description: Air temperature in degrees Celsius.

      - name: relative_humidity_pct
        description: Relative humidity percentage from 0 to 100.

      - name: precipitation_mm
        description: Total precipitation in millimetres.

      - name: rain_mm
        description: Rainfall in millimetres.

      - name: wind_speed_kmh
        description: Wind speed in kilometres per hour.

      - name: ingested_at
        description: UTC timestamp when the Python pipeline ingested the row.

  - name: stg_mobility__active_mobility_counts
    description: >-
      Bicycle, pedestrian, and scooter counts exposed without changing source
      interval granularity.
    columns:
      - name: sensor_id
        description: Identifier of the counting location.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mobility__active_mobility_sensors')
                field: sensor_id

      - name: flow_id
        description: Identifier of one directional travel-mode flow.
        data_tests:
          - not_null

      - name: travel_mode
        description: Bike, pedestrian, or scooter.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bike', 'pedestrian', 'scooter']

      - name: observed_at_utc
        description: Observation timestamp normalized to UTC.
        data_tests:
          - not_null

      - name: interval_minutes
        description: Source measurement interval in minutes.
        data_tests:
          - accepted_values:
              arguments:
                values: [15, 60]
                quote: false

      - name: mobility_count
        description: Observed count, nullable when the source omitted a value.

      - name: source_status
        description: Raw, modified, or deleted source status.

      - name: ingested_at
        description: UTC timestamp when the Python pipeline ingested the row.

  - name: stg_mobility__active_mobility_sensors
    description: Current metadata snapshot for active-mobility sensors.
    columns:
      - name: sensor_id
        description: Unique sensor identifier.
        data_tests:
          - not_null
          - unique

      - name: sensor_name
        description: Human-readable sensor name.

      - name: latitude
        description: Sensor latitude in decimal degrees.
        data_tests:
          - not_null

      - name: longitude
        description: Sensor longitude in decimal degrees.
        data_tests:
          - not_null

      - name: recording_interval_minutes
        description: Sensor recording interval in minutes.
        data_tests:
          - accepted_values:
              arguments:
                values: [15, 60]
                quote: false

      - name: travel_modes
        description: Comma-separated modes supported by the sensor.

      - name: operator_name
        description: Organization operating the sensor.

  - name: stg_mobility__subway_ridership
    description: >-
      Hourly subway ridership exposed from the landing layer without changing
      its station and fare-category granularity.
    columns:
      - name: observed_at_local
        description: New York local observation timestamp.

      - name: observed_at_utc
        description: Observation timestamp normalized to UTC.
        data_tests:
          - not_null

      - name: timezone
        description: IANA timezone used for the observation.

      - name: transit_mode
        description: Transit mode reported by the source.
        data_tests:
          - not_null

      - name: station_complex_id
        description: MTA station-complex identifier.
        data_tests:
          - not_null

      - name: station_complex
        description: Human-readable station-complex name.

      - name: borough
        description: New York City borough containing the station.

      - name: payment_method
        description: Payment method used by riders.
        data_tests:
          - not_null

      - name: fare_class_category
        description: Fare category reported by the MTA source.
        data_tests:
          - not_null

      - name: ridership
        description: Estimated number of riders.

      - name: transfers
        description: Estimated number of transfers included in ridership.

      - name: latitude
        description: Station latitude.

      - name: longitude
        description: Station longitude.

      - name: ingested_at
        description: UTC timestamp when the Python pipeline ingested the row.
