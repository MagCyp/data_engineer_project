x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: data-platform:local
  env_file:
    - .env
  environment:
    &airflow-common-environment
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:-local_airflow_jwt_secret_change_me}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-local_airflow_api_secret_change_me}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres_db:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    DBT_PROFILES_DIR: /opt/airflow/project/data_platform_analytics
    POSTGRES_HOST: postgres_db
    POSTGRES_PORT: "5432"
    PYTHONPATH: /opt/airflow/project/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins:ro
    - ./src:/opt/airflow/project/src:ro
    - ./config:/opt/airflow/project/config:ro
    - ./data:/opt/airflow/project/data
    - ./alembic:/opt/airflow/project/alembic:ro
    - ./alembic.ini:/opt/airflow/project/alembic.ini:ro
    - ./data_platform_analytics:/opt/airflow/project/data_platform_analytics
  user: "${AIRFLOW_UID:-50000}:0"
  working_dir: /opt/airflow/project
  depends_on:
    &airflow-common-depends-on
    postgres_db:
      condition: service_healthy
    airflow-db-init:
      condition: service_completed_successfully

services:
  postgres_db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-airflow-db.sql:/docker-entrypoint-initdb.d/10-create-airflow-db.sql:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow-db-init:
    image: postgres:18
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - ./docker/postgres/init-airflow-db.sql:/init-airflow-db.sql:ro
    entrypoint: ["psql"]
    command:
      - --set=ON_ERROR_STOP=1
      - --host=postgres_db
      - --username=${POSTGRES_USER}
      - --dbname=${POSTGRES_DB}
      - --file=/init-airflow-db.sql
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: "no"

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        set -e
        airflow version
        /opt/airflow/project-venv/bin/alembic \
          -c /opt/airflow/project/alembic.ini upgrade head
        airflow pools set weather_pipeline 1 "Weather pipeline writers"
        airflow pools set active_mobility_pipeline 1 "Active mobility pipeline writers"
        airflow pools set subway_pipeline 1 "Subway pipeline writers"
        airflow pools set dbt_build 1 "dbt model builders"
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
